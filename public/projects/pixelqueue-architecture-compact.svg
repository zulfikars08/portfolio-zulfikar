<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PixelQueue processing flow</title>
  <desc id="desc">React sends images to Fastify, Redis and BullMQ queue the work, Sharp processes it, then publishes the output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111a35"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1280" height="720" rx="42" fill="url(#bg)"/>
  <text x="640" y="120" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="800">PixelQueue</text>
  <text x="640" y="169" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="25">Asynchronous image processing</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif" font-weight="750" text-anchor="middle">
    <g><rect x="55" y="285" width="190" height="130" rx="26" fill="#0f263d" stroke="#67e8f9" stroke-width="4"/><text x="150" y="365" fill="#e0f2fe" font-size="35">React</text></g>
    <g><rect x="300" y="285" width="190" height="130" rx="26" fill="#17233f" stroke="#818cf8" stroke-width="4"/><text x="395" y="365" fill="#e0e7ff" font-size="35">Fastify</text></g>
    <g><rect x="545" y="285" width="190" height="130" rx="26" fill="#231c3e" stroke="#c084fc" stroke-width="4"/><text x="640" y="345" fill="#f3e8ff" font-size="31">Redis</text><text x="640" y="383" fill="#f3e8ff" font-size="27">BullMQ</text></g>
    <g><rect x="790" y="285" width="190" height="130" rx="26" fill="#342714" stroke="#fbbf24" stroke-width="4"/><text x="885" y="365" fill="#fef3c7" font-size="35">Sharp</text></g>
    <g><rect x="1035" y="285" width="190" height="130" rx="26" fill="#123127" stroke="#4ade80" stroke-width="4"/><text x="1130" y="365" fill="#dcfce7" font-size="35">Output</text></g>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M255 350h30l-14-14m14 14-14 14"/><path d="M500 350h30l-14-14m14 14-14 14"/><path d="M745 350h30l-14-14m14 14-14 14"/><path d="M990 350h30l-14-14m14 14-14 14"/>
  </g>
  <text x="640" y="540" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="26">Upload → Queue → Process → Download</text>
</svg>
