<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PixelQueue image processing architecture</title>
  <desc id="desc">React frontend sends uploads to Fastify API, which queues jobs in Redis and BullMQ for a Sharp worker to create processed output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111936"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1120" cy="80" r="230" fill="#7c3aed" opacity=".12"/>
  <circle cx="120" cy="650" r="260" fill="#06b6d4" opacity=".1"/>
  <text x="80" y="105" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="800">PixelQueue</text>
  <text x="80" y="148" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="22">Asynchronous image processing pipeline</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(65 250)">
      <rect width="205" height="190" rx="26" fill="#111c31" stroke="#67e8f9" stroke-width="2"/>
      <rect x="28" y="30" width="149" height="92" rx="12" fill="#0b1220" stroke="#334155"/>
      <path d="M50 101l30-31 24 22 21-17 31 26" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="102.5" y="151" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">React Frontend</text>
      <text x="102.5" y="176" fill="#94a3b8" font-size="15" text-anchor="middle">Upload image</text>
    </g>
    <g transform="translate(320 250)">
      <rect width="205" height="190" rx="26" fill="#111c31" stroke="#a78bfa" stroke-width="2"/>
      <path d="M55 65h95M55 94h95M55 123h62" stroke="#a78bfa" stroke-width="9" stroke-linecap="round"/>
      <text x="102.5" y="151" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Fastify API</text>
      <text x="102.5" y="176" fill="#94a3b8" font-size="15" text-anchor="middle">Validate + enqueue</text>
    </g>
    <g transform="translate(575 250)">
      <rect width="205" height="190" rx="26" fill="#111c31" stroke="#f87171" stroke-width="2"/>
      <ellipse cx="102.5" cy="62" rx="53" ry="20" fill="none" stroke="#f87171" stroke-width="7"/>
      <path d="M49.5 62v59c0 11 24 20 53 20s53-9 53-20V62M49.5 91c0 11 24 20 53 20s53-9 53-20" fill="none" stroke="#f87171" stroke-width="7"/>
      <text x="102.5" y="166" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Redis / BullMQ</text>
    </g>
    <g transform="translate(830 250)">
      <rect width="205" height="190" rx="26" fill="#111c31" stroke="#fbbf24" stroke-width="2"/>
      <path d="M67 55l71 71M138 55l-71 71M102.5 42v97M54 90h97" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
      <text x="102.5" y="151" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Sharp Worker</text>
      <text x="102.5" y="176" fill="#94a3b8" font-size="15" text-anchor="middle">Process + retry</text>
    </g>
    <g transform="translate(1085 250)">
      <rect width="130" height="190" rx="26" fill="#111c31" stroke="#4ade80" stroke-width="2"/>
      <path d="M65 45v67m-25-26l25 26 25-26M35 135h60" fill="none" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="65" y="165" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Output</text>
    </g>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276 345h36m-12-12 12 12-12 12"/>
    <path d="M531 345h36m-12-12 12 12-12 12"/>
    <path d="M786 345h36m-12-12 12 12-12 12"/>
    <path d="M1041 345h36m-12-12 12 12-12 12"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="80" y="520" width="1120" height="100" rx="24" fill="#0b1220" stroke="#26344d"/>
    <circle cx="125" cy="570" r="10" fill="#fbbf24"/>
    <text x="150" y="578" fill="#cbd5e1" font-size="20">Queued</text>
    <path d="M270 570h80" stroke="#475569" stroke-width="3" stroke-dasharray="8 8"/>
    <circle cx="385" cy="570" r="10" fill="#67e8f9"/>
    <text x="410" y="578" fill="#cbd5e1" font-size="20">Processing</text>
    <path d="M555 570h80" stroke="#475569" stroke-width="3" stroke-dasharray="8 8"/>
    <circle cx="670" cy="570" r="10" fill="#4ade80"/>
    <text x="695" y="578" fill="#cbd5e1" font-size="20">Completed</text>
    <path d="M835 570h80" stroke="#475569" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="950" y="578" fill="#fff" font-size="20" font-weight="700">Download WebP</text>
  </g>
</svg>
